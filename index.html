    <main>
        <section class="Gestion">
            <h2 class="title">Gestion des demandes</h2>
            <h6 class="description">Suivez et gérez les incidents informatiques.</h6>
            <div class="creation">
                <h2 class="creation-title">Créer une demande</h2>
                <h6 class="description">Décrivez votre problème informatique.</h6>
                <div class="form">
                    <form action="" class="spacing">
                        <div class="prob">
                            <label for="problem" class="labels">Titre du problème *</label><br class="breaks"><br
                                class="breaks">
                            <input type="text" id="problem" name="problem" class="select fract" required><br
                                class="breaks"><br class="breaks">
                        </div>
                        <div>
                            <label for="category" class="labels">Catégorie *</label><br class="breaks"><br
                                class="breaks">
                            <select name="category" id="category" class="select">
                                <option value="material">Matériel</option>
                                <option value="Logiciel">Logiciel</option>
                                <option value="Réseau">Réseau</option>
                            </select><br class="breaks"><br class="breaks">
                        </div>
                        <div>
                            <label for="priority" class="labels">Priorité *</label><br class="breaks"><br
                                class="breaks">
                            <select name="priority" id="priority" class="select">
                                <option value="low">Basse</option>
                                <option value="normal">Normale</option>
                                <option value="high">Haute</option>
                            </select><br class="breaks"><br class="breaks">
                        </div>
                        <div class="descrip">
                            <label for="Description" class="labels">Description *</label><br class="breaks"><br
                                class="breaks">
                            <input type="text" id="description" name="Description" class="select" required><br
                                class="breaks"><br class="breaks">
                            
                        </div>
                        <div class="space">
                            <br>
                        </div>
                        <div class="buttondiv">
                            <input type="submit" id="btn" value="＋  Ajouter la demande" class="button"><br
                                class="breaks"><br class="breaks">
                        </div>


                    </form>
                </div>
            </div>
        </section>
        <section class="cartes">
            <div class="title1">
                <h2>Liste des demandes</h2>
                <h6 id="counter">0 demandes</h6>
            </div>
